services:
  app1:
    build: .
    container_name: app1
    environment:
      - INSTANCE_NAME=app1
    networks:
      - highload-net
    # Порт наружу не открываем — доступ только через Nginx

  app2:
    build: .
    container_name: app2
    environment:
      - INSTANCE_NAME=app2
    networks:
      - highload-net

  app3:
    build: .
    container_name: app3
    environment:
      - INSTANCE_NAME=app3
    networks:
      - highload-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - highload-net

networks:
  highload-net:
    driver: bridge