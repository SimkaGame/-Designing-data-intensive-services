services:
  postgres-primary:
    image: postgres:15
    container_name: postgres-shop
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - highload-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    networks:
      - highload-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - highload-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - highload-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:shop@postgres-primary:5432/shop
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - highload-net
    restart: unless-stopped

  celery-worker:
    build: .
    container_name: celery-worker
    command: celery -A app.tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:shop@postgres-primary:5432/shop
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - api
      - redis
    networks:
      - highload-net
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: celery-beat
    command: celery -A app.tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:shop@postgres-primary:5432/shop
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - api
      - redis
    networks:
      - highload-net
    restart: unless-stopped

  outbox-publisher:
    build: .
    container_name: outbox-publisher
    command: python -m app.outbox_publisher
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:shop@postgres-primary:5432/shop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - api
      - kafka
    networks:
      - highload-net
    restart: unless-stopped

  kafka-consumer:
    build: .
    container_name: kafka-consumer
    command: python -m app.kafka_consumer
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:shop@postgres-primary:5432/shop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - api
      - kafka
    networks:
      - highload-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  highload-net:
    driver: bridge