version: '3.8'

services:
  postgres-primary:
    image: postgres:15
    container_name: postgres-shop
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - highload-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    networks:
      - highload-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Раскомментируй этот блок ПОЗЖЕ, когда установишь библиотеки и создашь Dockerfile
  # api:
  #   build: .
  #   container_name: api
  #   depends_on:
  #     postgres-primary:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://shop:shop@postgres-primary:5432/shop
  #     REDIS_URL: redis://redis:6379/0
  #   networks:
  #     - highload-net
